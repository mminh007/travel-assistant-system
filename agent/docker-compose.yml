# docker-compose
name: booking-agent-system

services:
  redis_cache:
    image: redis/redis-stack-server:latest
    container_name: booking_redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent_network

  rabbitmq_broker:
    #  http://localhost:15672 (account: guest / password: guest)
    image: rabbitmq:3-management-alpine
    container_name: booking_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent_network

  # 🚀 (Centralized Vector Database)
  qdrant_server:
    # http://localhost:6333/dashboard
    image: qdrant/qdrant:latest
    container_name: booking_qdrant_server
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/readyz" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agent_network

  # ─── CONTAINER 1: FASTAPI REST & STREAM WEB SERVER ───
  agent_api:
    build: .
    container_name: booking_api_server
    command: [ "./entrypoint.sh", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080" ]
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ${LOGS_DIR:-./logs}:/app/logs
    environment:
      - REDIS_URL=redis://redis_cache:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq_broker:5672/
      - QDRANT_SERVER_HOST=qdrant_server
      - QDRANT_SERVER_PORT=6333
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - VLLM_EMBEDDING_BASE_URL=${VLLM_EMBEDDING_BASE_URL:-http://host.docker.internal:8081/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct-AWQ}
      - VLLM_EMBEDDING_MODEL=${VLLM_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-4B}
      - VLLM_API_KEY=${VLLM_API_KEY:-EMPTY}
      - VLLM_MAX_CONTEXT_TOKENS=${VLLM_MAX_CONTEXT_TOKENS:-4096}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      redis_cache:
        condition: service_healthy
      rabbitmq_broker:
        condition: service_healthy
      qdrant_server:
        condition: service_started
    restart: always
    networks:
      - agent_network

  # ─── CONTAINER 2: GRPC STREAMING ENGINE ───
  agent_grpc:
    build: .
    container_name: booking_grpc_server
    command: [ "./entrypoint.sh", "python", "-m", "app.grpc_server" ]
    ports:
      - "50051:50051"
      - "8002:8001"
    volumes:
      - ./:/app
      - ${LOGS_DIR:-./logs}:/app/logs
    environment:
      - REDIS_URL=redis://redis_cache:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq_broker:5672/
      - QDRANT_SERVER_HOST=qdrant_server
      - QDRANT_SERVER_PORT=6333
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - VLLM_EMBEDDING_BASE_URL=${VLLM_EMBEDDING_BASE_URL:-http://host.docker.internal:8081/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct-AWQ}
      - VLLM_EMBEDDING_MODEL=${VLLM_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-4B}
      - VLLM_API_KEY=${VLLM_API_KEY:-EMPTY}
      - VLLM_MAX_CONTEXT_TOKENS=${VLLM_MAX_CONTEXT_TOKENS:-4096}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      redis_cache:
        condition: service_healthy
      rabbitmq_broker:
        condition: service_healthy
      qdrant_server:
        condition: service_started
    restart: always
    networks:
      - agent_network

  # ─── CONTAINER 3: ASYNC MEMORY EXTRACTION WORKER ───
  memory_worker:
    build: .
    container_name: booking_memory_worker
    command: [ "./entrypoint.sh", "python", "-m", "app.worker_main" ]
    volumes:
      - ./:/app
      - ${LOGS_DIR:-./logs}:/app/logs
    environment:
      - REDIS_URL=redis://redis_cache:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq_broker:5672/
      - QDRANT_SERVER_HOST=qdrant_server
      - QDRANT_SERVER_PORT=6333
    env_file:
      - .env
    depends_on:
      rabbitmq_broker:
        condition: service_healthy
      qdrant_server:
        condition: service_started
    restart: always
    networks:
      - agent_network

  # 🚀 INTEGRATION: PROMETHEUS TIME-SERIES DATABASE
  prometheus:
    #  http://localhost:9090
    image: prom/prometheus:v2.51.0
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e "s|__VLLM_METRICS_HOST__|$$VLLM_METRICS_HOST|g" \
            -e "s|__VLLM_EMBEDDING_METRICS_HOST__|$$VLLM_EMBEDDING_METRICS_HOST|g" \
            -e "s|__VLLM_API_KEY__|$$VLLM_API_KEY|g" \
            /etc/prometheus/prometheus.yml > /tmp/prometheus.yml && \
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --web.enable-remote-write-receiver \
          --enable-feature=native-histograms
    container_name: booking_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    environment:
      # Override these with actual vast.ai host:port when running remotely
      # e.g. VLLM_METRICS_HOST=137.175.22.196:8080
      - VLLM_METRICS_HOST=${VLLM_METRICS_HOST:-host.docker.internal:8080}
      - VLLM_EMBEDDING_METRICS_HOST=${VLLM_EMBEDDING_METRICS_HOST:-host.docker.internal:8081}
      - VLLM_API_KEY=${VLLM_API_KEY:-EMPTY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090" # Prometheus
    restart: always
    networks:
      - agent_network

  # 🚀  GRAFANA SERVER
  grafana:
    # http://localhost:3001 (account: admin / password: admin)
    image: grafana/grafana:10.4.1
    container_name: booking_grafana
    ports:
      - "3001:3000" # Dashboard port 3001 (User/Pass: admin/admin)
    volumes:
      - grafana_storage:/var/lib/grafana
      # Auto-provision datasource (Prometheus) and vLLM dashboard
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: always
    networks:
      - agent_network

  # 🚀 INTEGRATION: K6 LOAD TESTING ENGINE (run on-demand: docker compose --profile loadtest run --rm k6_load_test)
  k6_load_test:
    image: grafana/k6:latest
    container_name: booking_k6_runner
    profiles:
      - loadtest
    networks:
      - agent_network
    volumes:
      - ./load_tests:/load_tests
    environment:
      # Configure k6 to push metrics to Prometheus using Remote Write
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      # Export Trend metrics as native Prometheus histograms
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      - AGENT_HTTP_URL=http://agent_api:8080
      - AGENT_GRPC_HOST=agent_grpc:50051

    # Change K6_SCRIPT via env (defaults to http_stream_test.js)
    command: run -o experimental-prometheus-rw /load_tests/${K6_SCRIPT:-http_stream_test.js}

    depends_on:
      agent_api:
        condition: service_started
      prometheus:
        condition: service_started

  # 🎯 TRAVEL PERFORMANCE TEST ENGINE — HTTP REST / SSE
  k6_perf_test:
    image: grafana/k6:latest
    container_name: booking_k6_perf_runner
    profiles:
      - perftest
    networks:
      - agent_network
    volumes:
      - ./load_tests:/load_tests
    environment:
      # Prometheus Remote Write — push k6 custom metrics to Prometheus
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      # Agent endpoints
      - AGENT_HTTP_URL=http://agent_api:8080
      # Test behavior
      # STAGE_PROFILE: stepup | soak | spike | smoke (default: stepup)
      - STAGE_PROFILE=${STAGE_PROFILE:-stepup}
      # CACHE_MODE: unique (stress LLM/RAG, bypass semantic cache) | mixed (realistic)
      - CACHE_MODE=${CACHE_MODE:-unique}
      # COMPLEXITY_FILTER: all | low | medium | high (default: all — weighted 40/40/20)
      - COMPLEXITY_FILTER=${COMPLEXITY_FILTER:-all}
    command: run -o experimental-prometheus-rw /load_tests/travel_perf_test.js
    depends_on:
      agent_api:
        condition: service_started
      prometheus:
        condition: service_started

  # 🎯 TRAVEL PERFORMANCE TEST ENGINE — GRPC STREAMING
  k6_grpc_perf_test:
    image: grafana/k6:latest
    container_name: booking_k6_grpc_perf_runner
    profiles:
      - perftest
    networks:
      - agent_network
    volumes:
      - ./load_tests:/load_tests
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      - AGENT_GRPC_HOST=agent_grpc:50051
      - STAGE_PROFILE=${STAGE_PROFILE:-stepup}
      - CACHE_MODE=${CACHE_MODE:-unique}
      - COMPLEXITY_FILTER=${COMPLEXITY_FILTER:-all}
    command: run -o experimental-prometheus-rw /load_tests/travel_grpc_perf_test.js
    depends_on:
      agent_grpc:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  qdrant_data:
  grafana_storage:

networks:
  agent_network:
    external: true
